name: build

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t openwrt-corosync .
      - run: bash run-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: corosync-qnetd-mips_24kc
          path: output/
