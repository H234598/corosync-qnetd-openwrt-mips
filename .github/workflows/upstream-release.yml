name: upstream release

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-release
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test updater
        run: bash tests/check-upstream-update.sh

      - name: Check latest stable upstream release
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/update-upstream.sh

      - name: Commit version metadata locally
        if: steps.update.outputs.updated == 'true'
        env:
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          test "$(git diff --name-only)" = package/corosync-qnetd/Makefile
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package/corosync-qnetd/Makefile
          git commit -m "build: update corosync-qdevice to $VERSION"

      - name: Check release state
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.update.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Build SDK image
        if: steps.update.outputs.updated == 'true' || steps.release.outputs.needed == 'true'
        run: docker build -t openwrt-corosync .

      - name: Build and verify APK
        if: steps.update.outputs.updated == 'true' || steps.release.outputs.needed == 'true'
        run: bash run-build.sh

      - name: Publish commit and tag
        if: steps.update.outputs.updated == 'true' || steps.release.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.update.outputs.release_tag }}
          UPDATED: ${{ steps.update.outputs.updated }}
        run: |
          git fetch origin master --tags
          if [ "$UPDATED" = true ]; then
            test "$(git rev-parse origin/master)" = "$(git rev-parse HEAD^)"
            git tag "$RELEASE_TAG"
            git push --atomic origin HEAD:master "refs/tags/$RELEASE_TAG"
          elif git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          else
            git tag "$RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Create GitHub release
        if: steps.release.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.update.outputs.release_tag }}
          UPSTREAM_TAG: ${{ steps.update.outputs.upstream_tag }}
          VERSION: ${{ steps.update.outputs.version }}
        run: |
          notes=$(printf '%s\n\n%s\n%s\n%s\n' \
            "Automated build from corosync/corosync-qdevice $UPSTREAM_TAG." \
            'Build path: OpenWrt 25.12.5 ath79/generic SDK, MIPS 24Kc big endian, musl.' \
            'Release created only after package, APK, ELF, dependency, and build-log checks pass.' \
            "Upstream: https://github.com/corosync/corosync-qdevice/releases/tag/$UPSTREAM_TAG")
          gh release create "$RELEASE_TAG" \
            output/corosync-qnetd-"$VERSION"-r1.apk \
            output/sha256sums \
            output/build-info.txt \
            --verify-tag \
            --title "corosync-qnetd $VERSION-r1 for OpenWrt 25.12.5 MIPS" \
            --notes "$notes"

      - uses: actions/upload-artifact@v7
        if: steps.update.outputs.updated == 'true' || steps.release.outputs.needed == 'true'
        with:
          name: corosync-qnetd-${{ steps.update.outputs.version }}-mips_24kc
          path: output/
